name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests, build and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dienstplan
          POSTGRES_PASSWORD: dienstplan
          POSTGRES_DB: dienstplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dienstplan" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://dienstplan:dienstplan@localhost:5432/dienstplan
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @dienstplan/db generate
      - run: pnpm --filter @dienstplan/db exec prisma migrate deploy
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm --filter @dienstplan/web build
      - run: pnpm --filter @dienstplan/web exec playwright install --with-deps chromium
      - run: pnpm --filter @dienstplan/web e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  mobile:
    name: Mobile app (typecheck, tests, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform android --platform ios

  docker:
    name: Docker images and stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create a throw-away .env
        run: |
          cat > .env <<EOF
          DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          SESSION_SECRET=$(openssl rand -hex 32)
          EOF
      - run: docker compose config --quiet
      - name: Build the images
        run: docker compose build web migrate
      - name: Start database, migrations and the app, wait until the app reports healthy
        run: |
          dump() {
            docker compose ps -a
            # job logs are not always readable; surface the end of each service's log as annotations
            for svc in migrate web db; do
              docker compose logs --no-color --tail 15 "$svc" 2>&1 | sed 's/%/%25/g' | tr '\n' '\r' | sed "s/\r/%0A/g; s/^/::error title=$svc log::/"; echo
            done
          }
          docker compose up -d db web || { dump; exit 1; }
          for i in $(seq 1 100); do # up to 5 minutes: cold runners are sometimes slow to start the stack
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)" 2>/dev/null || echo starting)
            echo "web health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          dump
          exit 1
      - name: Health check through the container
        run: docker compose exec -T web node -e "fetch('http://127.0.0.1:3000/api/health').then(async r=>{console.log(r.status, await r.text()); process.exit(r.ok?0:1)})"
      - name: Bootstrap and create a user (operator CLI)
        run: |
          docker compose run --rm migrate pnpm --filter @dienstplan/db admin bootstrap --ward "CI Station" --email admin@example.com --name "CI Admin"
          docker compose run --rm -e PASSWORD=ci-test-password-1 migrate pnpm --filter @dienstplan/db admin create-user --email anna@example.com --name "Anna" --role employee
          docker compose run --rm migrate pnpm --filter @dienstplan/db admin list-users
      - name: Backup and verify the dump
        run: |
          docker compose run --rm -e ONCE=1 backup
          ls -l backups/*.dump
      - if: failure()
        run: docker compose logs --no-color
