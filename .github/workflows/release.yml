# Release: the newest version heading in CHANGELOG.md ("## [0.1.0] - …") is the version. When main gets a version that
# has no release yet, this builds the Docker images, pushes them to GitHub Container Registry and publishes a GitHub
# pre-release with tag v<version> and the notes of that section. So releasing = adding a new section to CHANGELOG.md.
# On pull requests that touch the release inputs it only builds and starts the demo stack once.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/release.yml", "Dockerfile", "docker-compose.demo.yml", "packages/db/prisma/**"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version from CHANGELOG.md
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          test -n "$v" || { echo "::error::No version heading in CHANGELOG.md"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" = push ] && ! gh release view "v$v" >/dev/null 2>&1; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v, publish: $publish"

  images:
    name: Docker images
    needs: [version]
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          docker build --target web -t dienstplan-web .
          docker build --target migrate -t dienstplan-migrate .
      - name: Demo stack starts and serves the login page
        run: |
          # the demo file uses the published images; test the ones just built from this commit instead
          repo="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker tag dienstplan-web "$repo/web:latest" && docker tag dienstplan-migrate "$repo/migrate:latest"
          docker compose -f docker-compose.demo.yml up -d --pull never
          for i in $(seq 1 100); do
            curl -fsS http://localhost:3000/login >/dev/null && { echo "demo stack up"; exit 0; }
            sleep 3
          done
          docker compose -f docker-compose.demo.yml ps -a
          for svc in migrate web; do
            docker compose -f docker-compose.demo.yml logs --no-color --tail 20 "$svc" 2>&1 | sed 's/%/%25/g' | tr '\n' '\r' | sed "s/\r/%0A/g; s/^/::error title=$svc log::/"; echo
          done
          exit 1
      - name: Push to GitHub Container Registry
        if: needs.version.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          v="${{ needs.version.outputs.version }}"
          for t in web migrate; do
            for tag in "$v" latest; do docker tag "dienstplan-$t" "$repo/$t:$tag" && docker push "$repo/$t:$tag"; done
          done

  publish:
    name: GitHub release
    if: needs.version.outputs.publish == 'true'
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create the pre-release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"
          # the section of this version: from its heading up to the next "## "
          awk -v v="$v" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "v$v" --target "$GITHUB_SHA" --prerelease --title "Dienstplan $v (Testversion)" --notes-file notes.md
